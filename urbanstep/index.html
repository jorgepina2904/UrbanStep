<!DOCTYPE html>
<html lang="es" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="UrbanStep Venezuela - Sneakers & Streetwear Store. Las mejores marcas en un solo lugar: Nike, Vans, Adidas, RS21, Puma." />
  <link rel="icon" type="image/png" href="/brand/urbanstep-emblem.png" />
  <link rel="apple-touch-icon" href="/brand/urbanstep-emblem.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>UrbanStep — Sneakers & Streetwear Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tipografías de la tienda web (Sportswear Elite) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            // Tienda web: prefijo "us-" para no alterar las fuentes del panel administrativo
            'us-display': ['Montserrat', 'Inter', 'sans-serif'],
            'us-body': ['Work Sans', 'Inter', 'sans-serif'],
            'us-mono': ['Space Grotesk', 'ui-monospace', 'monospace'],
          },
          colors: {
            // Neutros carbón de la tienda (Sportswear Elite) para todo el sistema: el modo oscuro del
            // panel usa estos tonos en fondos, tarjetas y bordes; en modo claro siguen siendo grises neutros.
            gray: {
              700: '#2f2f34',
              750: '#262629',
              800: '#1c1c20',
              850: '#18181b',
              900: '#131315',
              950: '#0e0e10',
            },
            // Paleta "Sportswear Elite" de la tienda web
            us: {
              cyan: '#00e5ff',
              ice: '#c3f5ff',
              ink: '#0e0e10',
              surface: '#131315',
              carbon: '#121318',
              panel: '#16171d',
              elevated: '#1a1c23',
              low: '#1c1b1d',
              mid: '#201f21',
              high: '#2a2a2c',
              highest: '#353437',
            }
          },
          keyframes: {
            modalIn: {
              '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
            }
          },
          animation: {
            modalIn: 'modalIn 0.3s ease-out',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .dark ::-webkit-scrollbar-thumb { background: #374151; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    
    /* Smooth transitions */
    * { scrollbar-width: thin; }
  </style>
</head>

<body class="font-sans bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
